<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transport System — Log in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  body{background: linear-gradient(to right, #00245E, #3B82F6); display:flex; align-items:center; justify-content:right; min-height:100vh; padding-right: 200px;}
  .login-card{background:rgba(255,255,255,0.5); width:100%; max-width:360px; border-radius:16px; padding:32px 28px ; box-shadow:0 20px 50px rgba(0,0,0,.35);}
  .login-brand{display:flex; flex-direction:column; align-items:center; gap:4px; margin-bottom:22px;}
  .login-brand .brand-name{font-family:arial; font-size:20px; color:var(--navy); font-weight: bold;}
  .login-card h1{font-size:18px; margin-bottom:4px; font-family: Arial, Helvetica, sans-serif;}
  .login-card h3{font-size: 8px; font-family: arial; margin-top: 20px; margin-left: 160px;}
  .login-card p.sub{color:blue; font-size:15px; margin:0 0 20px; font-weight: bold;}
  #loginError{color:var(--red); font-size:13px; min-height:18px; margin-top:6px;}
  .login-card .btn{width:100%; margin-top:-10px;}

  /* --- Animation additions --- */
body{ overflow:hidden; position:relative; }

.road-bg{
  position:fixed; inset:0; z-index:0;
  background:
    repeating-linear-gradient(
      120deg,
      rgba(242,166,90,0.05) 0px, rgba(242,166,90,0.05) 2px,
      transparent 2px, transparent 46px
    );
  animation: roadMove 10s linear infinite;
}
@keyframes roadMove{
  0%   { background-position: 0 0; }
  100% { background-position: 260px 0; }
}

.login-card{
  position:relative; z-index:1;
  opacity:0; transform:translateY(24px);
  animation: cardIn .65s cubic-bezier(.2,.7,.3,1) .15s forwards;
}
@keyframes cardIn{
  to{ opacity:1; transform:translateY(0); }
}

.login-brand .brand-mark{
  display:inline-block;
  animation: markSpin 1.1s ease-out .5s both;
}
@keyframes markSpin{
  from{ transform:rotate(-90deg) scale(.4); opacity:0; }
  to{ transform:rotate(0) scale(1); opacity:1; }
}

.login-hero{
  position:relative; z-index:1;
  max-width:750px;
  margin-right:60px;
  opacity:0;
  transform:translateX(-60px);
  animation: heroSlideIn .7s cubic-bezier(.2,.7,.3,1) .1s forwards;
}
@keyframes heroSlideIn{
  to{ opacity:1; transform:translateX(0); }
}
.login-hero h2{
  color:#fff;
  font-family: arial;
  font-size:50px;
  font-weight:600;
  line-height:1.35;
  opacity:0.95;
}
@media (max-width: 900px){
  body{ justify-content:center !important; padding-right:0 !important; }
  .login-hero{ display:none; }
}
</style>
  
</style>
</head>
<body>
  <div class="road-bg"></div>
  <div class="login-hero">
    <h2>Manage your company's vehicle fleet securely and efficiently from one central platform.</h2>
  </div>
  <div class="login-card">
    <img src="images/logo.png" alt="Company logo" class="company-logo2">
    <div class="login-brand">
      <span class="brand-name">Imo Chicken & Agro (Pvt) Ltd</span>
    </div>
    <h1>Login</h1>
    <p class="sub">Transport Department</p>

    <form id="loginForm">
      <label class="field">
  <span>Username</span>
  <input type="text" id="username" autocomplete="username" required autofocus>
</label>
<label class="field" style="margin-top:12px">
  <span>Password</span>
  <input type="password" id="password" autocomplete="current-password" required>
</label>
      <p id="loginError"></p>
      <button class="btn btn-primary" type="submit">Log in</button>
      <h3>© 2026 MIS Dep. All rights reserved.</h3>
    </form>
  </div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script>
  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;
    const errorEl = document.getElementById("loginError");
    errorEl.textContent = "Checking…";
    try {
      const res = await Api.login(username, password);
      if (res.success) {
        sessionStorage.setItem("vms_user", JSON.stringify({ username: res.username, role: res.role, allowedTabs: res.allowedTabs || [], noEditTabs: res.noEditTabs || [], noDeleteTabs: res.noDeleteTabs || [] }));
        window.location.href = "index.html";
      } else {
        errorEl.textContent = "Wrong username or password.";
      }
    } catch (err) {
      errorEl.textContent = "Couldn't reach server: " + err.message;
    }
  });
</script>
</body>
</html>
